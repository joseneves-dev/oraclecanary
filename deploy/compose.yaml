# Production stack: PostgreSQL, the Symfony API + web app (FrankenPHP/Caddy, HTTPS), the Solana
# indexer, the Telegram alerts, the wallet positions service and a daily database backup.
# Configure it with deploy/.env (see .env.example).
name: oraclecanary

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oraclecanary}
      POSTGRES_USER: ${POSTGRES_USER:-oraclecanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-oraclecanary}", "-U", "${POSTGRES_USER:-oraclecanary}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../web
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}?serverVersion=16&charset=utf8
      SERVER_NAME: ${SERVER_NAME:-:80}
      # The indexer runs every CHECK_INTERVAL_SECONDS; allow a few missed runs before /api/health fails.
      HEALTH_MAX_DATA_AGE_SECONDS: ${HEALTH_MAX_DATA_AGE_SECONDS:-1200}
      # Signs /api/reserves/{address}/attestation for oracle_guard; empty disables it.
      ATTESTATION_SECRET_KEY: ${ATTESTATION_SECRET_KEY:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # The built web app (see README: it is deployed separately).
      - ${UI_DIST:-./ui}:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config

  indexer:
    build: ../indexer
    restart: unless-stopped
    depends_on:
      - api # applies the database migrations on start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}
      RPC_URL: ${RPC_URL:?Set RPC_URL in deploy/.env}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-300}
      # "on" publishes PRICE_DEVIATION (oracle price far from the market). It names reserves one by one,
      # so it stays off until the findings have been shared with the protocols privately.
      PRICE_DEVIATION_CHECK: ${PRICE_DEVIATION_CHECK:-off}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/healthcheck.ts"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 180s

  # The bot's private side: /watch <wallet> in a DM, then a message when a price behind that wallet's
  # loan accounts can no longer be used, and when it recovers. Idle until TELEGRAM_BOT_TOKEN is set.
  bot:
    build: ../indexer
    restart: unless-stopped
    depends_on:
      - api # applies the database migrations on start
    command: ["npm", "run", "bot"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      RPC_URL: ${RPC_URL:?Set RPC_URL in deploy/.env}
      POSITIONS_RPC_URL: ${POSITIONS_RPC_URL:-}
      SITE_URL: ${SITE_URL:-https://oraclecanary.com}
      # Every watched wallet is read this often; the health check reads the same value.
      WATCH_INTERVAL_SECONDS: 300
      CHECK_INTERVAL_SECONDS: 300
      HEARTBEAT_FILE: /data/bot.heartbeat
    volumes:
      - bot_data:/data
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/healthcheck.ts"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 180s

  # Reads a wallet's lending positions from the chain for the "My positions" page
  # (GET /api/wallets/{address}/positions, proxied by the api service). Read-only, stores nothing.
  positions:
    build: ../indexer
    restart: unless-stopped
    command: ["npm", "run", "positions"]
    environment:
      RPC_URL: ${RPC_URL:?Set RPC_URL in deploy/.env}
      # Optional separate key, so public lookups cannot use up the indexer's RPC quota.
      POSITIONS_RPC_URL: ${POSITIONS_RPC_URL:-}
      POSITIONS_PORT: 3001
    healthcheck:
      # Any JSON answer means the server is up; the root path is a 404 by design.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.status === 404 ? 0 : 1), () => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s

  # Posts alerts for new incidents to a Telegram channel; idle until TELEGRAM_BOT_TOKEN is set.
  alerts:
    build: ../indexer
    restart: unless-stopped
    depends_on:
      - api # applies the database migrations on start
    command: ["npm", "run", "notify"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-@OracleCanaryAlerts}
      SITE_URL: ${SITE_URL:-https://oraclecanary.com}
      ALERT_MIN_SUPPLY_USD: ${ALERT_MIN_SUPPLY_USD:-10000}
      # Daily "still watching" summary at this UTC hour (just after the US market opens); "off" disables it.
      SUMMARY_HOUR_UTC: ${SUMMARY_HOUR_UTC:-14}
      # Polls every CHECK_INTERVAL_SECONDS; the health check reads the same value and HEARTBEAT_FILE.
      CHECK_INTERVAL_SECONDS: 60
      HEARTBEAT_FILE: /data/alerts.heartbeat
    volumes:
      - alerts_data:/data
    # "unhealthy" when polls keep failing or Telegram keeps refusing messages (e.g. the bot was
    # removed from the channel). Without a token there is no heartbeat, so it shows as unhealthy.
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/healthcheck.ts"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 180s

  # Dumps the database every day into ./backups and keeps the last BACKUP_KEEP_DAYS dumps.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:-oraclecanary}
      PGUSER: ${POSTGRES_USER:-oraclecanary}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # The first dump waits for the migrations and a first indexer run.
        sleep 3600
        while true; do
          file=/backups/oraclecanary-$$(date -u +%Y%m%d-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$file.tmp"; then mv "$$file.tmp" "$$file"; echo "Backup written: $$file"; else rm -f "$$file.tmp"; echo 'Backup failed' >&2; fi
          find /backups -name 'oraclecanary-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  bot_data:
  database_data:
  caddy_data:
  caddy_config:
  alerts_data:
