<!doctype html>
<html lang="en" dir="ltr" data-ax-accent="canary">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- Sets the light/dark mode and the collapsed sidebar before the first paint, so the page never
     flashes the wrong colours. Must stay the first script in <head>; keys match useTheme.ts. -->
<script>
(function () {
  var D = document.documentElement, LS = null, theme = null;
  try { LS = window.localStorage; } catch (e) {}
  function get(k) { try { return LS && LS.getItem(k); } catch (e) { return null; } }
  theme = get("oc:theme");
  if (theme !== "light" && theme !== "dark") {
    try { theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) { theme = "light"; }
  }
  D.setAttribute("data-ax-theme", theme);
  /* Sidebar: the viewer's choice wins ("1" collapsed, "0" open); with no choice
     the rail starts as icons between 768 and 1279px so tables get the room. */
  var KEY = "oc:sidebar-collapsed", pref = get(KEY), band = false;
  try { band = window.matchMedia("(min-width: 768px) and (max-width: 1279.98px)").matches; } catch (e) {}
  if (pref === "1" || (pref !== "0" && band)) D.setAttribute("data-ax-collapsed", "");
  /* useTheme.ts stores "1" or clears the key; record an explicit "open" as "0"
     so the band default doesn't re-collapse a rail the viewer opened. */
  try {
    new MutationObserver(function () {
      try { if (!D.hasAttribute("data-ax-collapsed") && LS) LS.setItem(KEY, "0"); } catch (e) {}
    }).observe(D, { attributes: true, attributeFilter: ["data-ax-collapsed"] });
  } catch (e) {}
})();
</script>
