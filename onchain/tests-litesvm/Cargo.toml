[package]
name = "oracle_guard_tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT"

[dev-dependencies]
litesvm = { version = "=0.13.1", features = ["precompiles"] }
solana-account = "3.4"
solana-address = { version = "2", features = ["curve25519", "atomic", "decode"] }
solana-clock = "3.0"
solana-instruction = "=3.2.0"
solana-keypair = "3.1"
solana-sdk-ids = "3.1"
solana-signer = "3.0"
solana-transaction = "3.1"
solana-transaction-error = "3.1"
sha2 = "0.10"
