[package]
name = "demo_vault"
version = "0.1.0"
description = "Demo only: a mock vault that asks oracle_guard before accepting a deposit"
edition = "2021"
rust-version = "1.79"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "demo_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "oracle_guard/idl-build"]

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
oracle_guard = { path = "../oracle_guard", features = ["cpi"] }
