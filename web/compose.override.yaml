
services:
###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Fixed host port 5433 (5432 is often taken by a local PostgreSQL); the indexer uses it too
      - "5433:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###
