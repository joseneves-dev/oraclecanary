# Production stack: PostgreSQL, the Symfony API + web app (FrankenPHP/Caddy, HTTPS), the Solana
# indexer and a daily database backup. Configure it with deploy/.env (see .env.example).
name: oraclecanary

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oraclecanary}
      POSTGRES_USER: ${POSTGRES_USER:-oraclecanary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-oraclecanary}", "-U", "${POSTGRES_USER:-oraclecanary}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ../web
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in deploy/.env}
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}?serverVersion=16&charset=utf8
      SERVER_NAME: ${SERVER_NAME:-:80}
      # The indexer runs every CHECK_INTERVAL_SECONDS; allow a few missed runs before /health fails.
      HEALTH_MAX_DATA_AGE_SECONDS: ${HEALTH_MAX_DATA_AGE_SECONDS:-1200}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      # The built web app (see README: it is deployed separately).
      - ${UI_DIST:-./ui}:/srv/ui:ro
      - caddy_data:/data
      - caddy_config:/config

  indexer:
    build: ../indexer
    restart: unless-stopped
    depends_on:
      - api # applies the database migrations on start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oraclecanary}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-oraclecanary}
      RPC_URL: ${RPC_URL:?Set RPC_URL in deploy/.env}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-300}
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/healthcheck.ts"]
      interval: 60s
      timeout: 10s
      retries: 1
      start_period: 180s

  # Dumps the database every day into ./backups and keeps the last BACKUP_KEEP_DAYS dumps.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGHOST: database
      PGDATABASE: ${POSTGRES_DB:-oraclecanary}
      PGUSER: ${POSTGRES_USER:-oraclecanary}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # The first dump waits for the migrations and a first indexer run.
        sleep 3600
        while true; do
          file=/backups/oraclecanary-$$(date -u +%Y%m%d-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$file.tmp"; then mv "$$file.tmp" "$$file"; echo "Backup written: $$file"; else rm -f "$$file.tmp"; echo 'Backup failed' >&2; fi
          find /backups -name 'oraclecanary-*.sql.gz' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  database_data:
  caddy_data:
  caddy_config:
