nelmio_cors:
    defaults:
        max_age: 3600
    paths:
        # The API is public and read-only: any site may read it, nothing may write to it.
        '^/api/':
            allow_origin: ['*']
            allow_methods: ['GET', 'OPTIONS']
            allow_headers: ['Accept', 'Content-Type']
            expose_headers: ['Link']
