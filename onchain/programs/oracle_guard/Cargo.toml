[package]
name = "oracle_guard"
version = "0.1.0"
description = "Refuses to act when OracleCanary attests that a lending reserve's oracle is unhealthy"
edition = "2021"
rust-version = "1.79"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_guard"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
