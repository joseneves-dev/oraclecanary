api_platform:
    title: OracleCanary API
    description: 'Which oracle every Solana lending market depends on, and whether it is healthy.'
    version: 1.0.0
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    # src/Mcp holds the MCP tools (resources with no HTTP operation); listing paths replaces the
    # default ones, so they are repeated here.
    mapping:
        paths:
            - '%kernel.project_dir%/src/ApiResource'
            - '%kernel.project_dir%/src/Entity'
            - '%kernel.project_dir%/src/Mcp/Tool'
    # MCP tool results as plain JSON, without JSON-LD's @context/@id noise.
    mcp:
        format: json
